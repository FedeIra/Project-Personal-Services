service: fedeira-personal-services
frameworkVersion: '4'
variablesResolutionMode: 20210326

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: false
    target: 'node20'

# AWS provider configuration:
provider:
  name: aws
  runtime: nodejs20.x
  profile: Developer-Fedeira
  region: us-east-2
  stage: dev
  apiName: 'dev-fedeira-personal-services'
  deploymentBucket:
    name: dev-fedeira-personal-services-bucket
  apiGateway:
    minimumCompressionSize: 1024
    binaryMediaTypes:
      - 'multipart/form-data'
  tags:
    Project: 'Fedeira Personal Services'
    Service: 'Personal-services'
    Environment: 'dev'

  environment:
    IS_OFFLINE: 'false'

    # SSM
    ACCOUNT_NUMBER_PPI: ${env:ACCOUNT_NUMBER_PPI, ssm:/fedeira-personal-services/ppi/accountNumber}
    AUTHORIZED_CLIENT_PPI: ${env:AUTHORIZED_CLIENT_PPI, ssm:/fedeira-personal-services/ppi/authorizedClient}

    CLIENT_KEY_PPI_PROD: ${env:CLIENT_KEY_PPI_PROD, ssm:/fedeira-personal-services/prod/ppi/clientKey}
    API_KEY_PPI_PROD: ${env:API_KEY_PPI_PROD, ssm:/fedeira-personal-services/prod/ppi/apiKey}
    API_SECRET_PPI_PROD: ${env:API_SECRET_PPI_PROD, ssm:/fedeira-personal-services/prod/ppi/apiSecret}

    JWT_SECRET: ${env:JWT_SECRET, ssm:/fedeira-personal-services/auth/jwt/secret}
    USER_EMAIL: ${env:USER_EMAIL, ssm:/fedeira-personal-services/user/email}
    USER_PASSWORD: ${env:USER_PASSWORD, ssm:/fedeira-personal-services/user/password}

    ENCRYPTION_KEY: ${env:ENCRYPTION_KEY, ssm:/fedeira-personal-services/crypto/encryptionKey}

    # ENV locales
    API_VERSION_PPI: ${env:API_VERSION_PPI}
    API_KEY_PPI_TEST: ${env:API_KEY_PPI_TEST}
    API_SECRET_PPI_TEST: ${env:API_SECRET_PPI_TEST}
    CLIENT_KEY_PPI_TEST: ${env:CLIENT_KEY_PPI_TEST}
    ACCOUNT_NUMBER_PPI_TEST: ${env:ACCOUNT_NUMBER_PPI}
    AUTHORIZED_CLIENT_PPI_TEST: ${env:AUTHORIZED_CLIENT_PPI}
    BASE_URL_PPI_TEST: ${env:BASE_URL_PPI_TEST}
    BASE_URL_PPI_PROD: ${env:BASE_URL_PPI_PROD}
    ENCRYPTION_ALGORITHM: ${env:ENCRYPTION_ALGORITHM, 'aes-256-cbc'}
    ENCRYPTION_RANDOM_BYTES: ${env:ENCRYPTION_RANDOM_BYTES, '16'}
    USER_EMAIL_TEST: ${env:USER_EMAIL}
    USER_PASSWORD_TEST: ${env:USER_PASSWORD}
    AWS_REPORTS_BUCKET: ${env:AWS_REPORTS_BUCKET}
    AWS_REPORT_REQUESTS_QUEUE_URL: !Ref ReportRequestsQueue
    REPORT_REQUESTS_TABLE: ReportRequests
    PORTFOLIO_COMMENTS_TABLE: PortfolioComments
    PORTFOLIO_S3_BUCKET: dev-fedeira-personal-services-bucket
    PORTFOLIO_FROM_EMAIL: ${env:PORTFOLIO_FROM_EMAIL, ssm:/fedeira-personal-services/portfolio/fromEmail}
    PORTFOLIO_TO_EMAIL: ${env:PORTFOLIO_TO_EMAIL, ssm:/fedeira-personal-services/portfolio/toEmail}

    # [Faros AI Word Cloud] - Word Cloud service environment variables:
    FAROS_PROCESSED_URLS_TABLE: FarosProcessedUrls
    FAROS_WORD_COUNTS_TABLE: FarosWordCounts
    FAROS_WORDCLOUD_QUEUE_URL: !Ref FarosWordCloudQueue
    FAROS_WORDCLOUD_CACHE_BUCKET: dev-fedeira-personal-services-bucket

  # Monitoring & Logging:
  tracing:
    apiGateway: true
    lambda: true
  logs:
    restApi: true
    logRetentionInDays: 30

  # IAM role permissions for Lambda functions:
  iam:
    role:
      statements:
        # Permit for ssm operations
        - Effect: 'Allow'
          Action:
            - 'ssm:GetParameter'
            - 'ssm:GetParameters'
            - 'ssm:PutParameter'
          Resource:
            - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/fedeira-personal-services/*'
        # Permit for dynamodb operations
        - Effect: 'Allow'
          Action:
            - 'dynamodb:Query'
            - 'dynamodb:Scan'
            - 'dynamodb:GetItem'
            - 'dynamodb:PutItem'
            - 'dynamodb:UpdateItem'
            - 'dynamodb:DeleteItem'
          Resource:
            - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/UserCredentials'
            - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Accounts'
            - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ReportRequests'
            - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/PortfolioComments'
            # [Faros AI Word Cloud] - DynamoDB tables for Word Cloud:
            - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FarosProcessedUrls'
            - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/FarosWordCounts'
        # Permit for logs operations in cloudwatch
        - Effect: 'Allow'
          Action:
            - 'logs:CreateLogGroup'
            - 'logs:CreateLogStream'
            - 'logs:PutLogEvents'
          Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*'
        # Permit for ses operations
        - Effect: 'Allow'
          Action:
            - 'ses:SendEmail'
            - 'ses:SendRawEmail'
          Resource: '*'
        # Permit for S3 operations
        - Effect: 'Allow'
          Action:
            - 's3:ListBucket'
            - 's3:GetBucketLocation'
            - 's3:GetObject'
            - 's3:PutObject'
            - 's3:DeleteObject'
          Resource:
            - 'arn:aws:s3:::dev-fedeira-personal-services-bucket'
            - 'arn:aws:s3:::dev-fedeira-personal-services-bucket/*'
            - 'arn:aws:s3:::dev-fedeira-personal-services-reports'
            - 'arn:aws:s3:::dev-fedeira-personal-services-reports/*'
            # Permit for SQS operations:
        - Effect: 'Allow'
          Action:
            [
              'sqs:SendMessage',
              'sqs:ReceiveMessage',
              'sqs:DeleteMessage',
              'sqs:GetQueueAttributes',
              'sqs:ChangeMessageVisibility',
            ]
          Resource:
            - !GetAtt ReportRequestsQueue.Arn
            # [Faros AI Word Cloud] - SQS permissions for Word Cloud queue:
            - !GetAtt FarosWordCloudQueue.Arn
# Lambda functions definitions:
functions:
  # Custom authorizer Lambda for API Gateway (verifies JWT tokens)
  auth-service-authorizer:
    handler: authorization-services/handler.authorizer
    name: 'dev-fedeira-authorization-services-authorizer'
    memorySize: 1024
    timeout: 10
  #  Authorizer lambda: Lambda for authorization-related endpoints
  authorization-service:
    handler: authorization-services/handler.login
    name: 'dev-fedeira-authorization-services'
    timeout: 29
    memorySize: 1024
    events:
      - http:
          path: login
          method: post
          cors: true
  # Investment domain Lambda:
  investment-service:
    handler: investment-services/handler.getAvailableBalance
    name: 'dev-fedeira-investment-services'
    timeout: 29
    memorySize: 1024
    events:
      - http:
          path: investment/available-balance
          method: get
          cors: true
          authorizer:
            name: auth-service-authorizer
            type: TOKEN
  # Account domain Lambda:
  account-service:
    handler: account-services/handler.getAccounts
    name: 'dev-fedeira-account-services'
    timeout: 29
    memorySize: 1024
    events:
      - http:
          path: accounts
          method: get
          cors: true
          authorizer:
            name: auth-service-authorizer
            type: TOKEN
  # Reports domain Lambda:
  report-service:
    handler: report-services/lambda.handler
    name: 'dev-fedeira-report-services'
    timeout: 29
    memorySize: 1024
    events:
      - http:
          path: reports/{email}
          method: post
          cors: true
          request:
            parameters:
              paths:
                email: true
          authorizer:
            name: auth-service-authorizer
            type: TOKEN
  # Report request processor Lambda
  report-request-processor:
    handler: report-services/handler.handler
    name: 'dev-fedeira-report-request-processor'
    environment:
      AWS_REPORTS_BUCKET: ${env:AWS_REPORTS_BUCKET}
      REPORT_REQUESTS_TABLE: ReportRequests
    events:
      - sqs:
          arn: !GetAtt ReportRequestsQueue.Arn
          batchSize: 1
          maximumBatchingWindow: 0
          functionResponseType: ReportBatchItemFailures
          maximumConcurrency: 10

  # [Faros AI Word Cloud] - Word Cloud HTTP Lambda (Fastify handles GET + POST /wordcloud):
  faros-ai-service:
    handler: faros-ai-services/lambda.handler
    name: 'dev-fedeira-faros-ai-services'
    timeout: 29
    memorySize: 1024
    events:
      - http:
          path: wordcloud
          method: get
          cors: true
          authorizer:
            name: auth-service-authorizer
            type: TOKEN
      - http:
          path: wordcloud
          method: post
          cors: true
          authorizer:
            name: auth-service-authorizer
            type: TOKEN

  # [Faros AI Word Cloud] - Word Cloud SQS Processor Lambda (async URL crawling):
  faros-ai-processor:
    handler: faros-ai-services/processor-handler.handler
    name: 'dev-fedeira-faros-ai-processor'
    timeout: 300
    memorySize: 1024
    environment:
      FAROS_PROCESSED_URLS_TABLE: FarosProcessedUrls
      FAROS_WORD_COUNTS_TABLE: FarosWordCounts
      FAROS_WORDCLOUD_CACHE_BUCKET: dev-fedeira-personal-services-bucket
    events:
      - sqs:
          arn: !GetAtt FarosWordCloudQueue.Arn
          batchSize: 1
          maximumBatchingWindow: 0
          functionResponseType: ReportBatchItemFailures
          maximumConcurrency: 10

  # Portfolio domain Lambda (single function, Fastify handles internal routing):
  portfolio-service:
    handler: portfolio-services/lambda.handler
    name: 'dev-fedeira-portfolio-services'
    timeout: 29
    memorySize: 1024
    events:
      - http:
          path: portfolio/comments
          method: get
          cors: true
      - http:
          path: portfolio/comments
          method: post
          cors: true
          authorizer:
            name: auth-service-authorizer
            type: TOKEN
      - http:
          path: portfolio/send-email
          method: post
          cors: true
      - http:
          path: portfolio/files/upload
          method: post
          cors: true
      - http:
          path: portfolio/files
          method: get
          cors: true
          authorizer:
            name: auth-service-authorizer
            type: TOKEN
      - http:
          path: portfolio/files/{fileName}/url
          method: get
          cors: true
          authorizer:
            name: auth-service-authorizer
            type: TOKEN
      - http:
          path: portfolio/files/{fileName}/download
          method: get
          cors: true
          authorizer:
            name: auth-service-authorizer
            type: TOKEN
      - http:
          path: portfolio/files/{fileName}
          method: get
          cors: true
          authorizer:
            name: auth-service-authorizer
            type: TOKEN
      - http:
          path: portfolio/files/{fileName}
          method: delete
          cors: true
          authorizer:
            name: auth-service-authorizer
            type: TOKEN

# AWS Resources: DynamoDB Tables, S3 Bucket and SQS Queue:
resources:
  Resources:
    UserCredentialsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: UserCredentials
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
    AccountsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Accounts
        AttributeDefinitions:
          - AttributeName: account
            AttributeType: S
          - AttributeName: user
            AttributeType: S
        KeySchema:
          - AttributeName: account
            KeyType: HASH
          - AttributeName: user
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
    ReportRequestsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ReportRequests
        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: email
            AttributeType: S
          - AttributeName: status
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S

        KeySchema:
          - AttributeName: id
            KeyType: HASH

        GlobalSecondaryIndexes:
          - IndexName: ByEmail
            KeySchema:
              - AttributeName: email
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: ByStatus
            KeySchema:
              - AttributeName: status
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
    PortfolioCommentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: PortfolioComments
        AttributeDefinitions:
          - AttributeName: commentId
            AttributeType: S
        KeySchema:
          - AttributeName: commentId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
    # S3Bucket:
    # Type: AWS::S3::Bucket
    # Properties:
    #   BucketName: dev-fedeira-personal-services-bucket
    #   CorsConfiguration:
    #     CorsRules:
    #       - AllowedHeaders:
    #           - '*'
    #         AllowedMethods:
    #           - GET
    #           - PUT
    #           - POST
    #           - DELETE
    #           - HEAD
    #         AllowedOrigins:
    #           - '*'
    #         MaxAge: 3000
    # [Faros AI Word Cloud] - DynamoDB table for URL deduplication:
    FarosProcessedUrlsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: FarosProcessedUrls
        AttributeDefinitions:
          - AttributeName: url
            AttributeType: S
        KeySchema:
          - AttributeName: url
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    # [Faros AI Word Cloud] - DynamoDB table for word frequency counts:
    FarosWordCountsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: FarosWordCounts
        AttributeDefinitions:
          - AttributeName: word
            AttributeType: S
        KeySchema:
          - AttributeName: word
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    # [Faros AI Word Cloud] - SQS Standard Queue for async URL processing:
    FarosWordCloudQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: FarosWordCloudQueue
        VisibilityTimeout: 300
        MessageRetentionPeriod: 1209600
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt FarosWordCloudDeadLetterQueue.Arn
          maxReceiveCount: 5

    # [Faros AI Word Cloud] - Dead Letter Queue for failed word cloud processing:
    FarosWordCloudDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: FarosWordCloudDeadLetterQueue
        MessageRetentionPeriod: 1209600

    # ReportsBucket:
    #   Type: AWS::S3::Bucket
    #   Properties:
    #     BucketName: dev-fedeira-personal-services-reports
    #     CorsConfiguration:
    #       CorsRules:
    #         - AllowedHeaders:
    #             - '*'
    #           AllowedMethods:
    #             - GET
    #             - PUT
    #             - POST
    #             - DELETE
    #             - HEAD
    #           AllowedOrigins:
    #             - '*'
    #           MaxAge: 3000
    ReportRequestsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ReportRequestsQueue.fifo
        FifoQueue: true
        ContentBasedDeduplication: true
        VisibilityTimeout: 300
        MessageRetentionPeriod: 1209600
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ReportRequestsDeadLetterQueue.Arn
          maxReceiveCount: 5
    ReportRequestsDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ReportRequestsDeadLetterQueue.fifo
        FifoQueue: true
        MessageRetentionPeriod: 1209600

    # API Gateway access logs:
    ApiGatewayAccessLogs:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName:
          Fn::Sub: 'API-Gateway-Execution-Logs_${ApiGatewayRestApi}/dev'
        RetentionInDays: 30
