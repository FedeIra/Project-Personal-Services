# Offline configuration:
service: fedeira-personal-services-offline
frameworkVersion: '4'
useDotenv: true

# Serverless plugins:
plugins:
  - serverless-dynamodb-local
  - serverless-offline

# AWS provider configuration:
provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-2
  stage: dev
  timeout: 29
  apiGateway:
    binaryMediaTypes:
      - 'multipart/form-data'
  # Environment variables available for Lambda functions:
  environment:
    IS_OFFLINE: 'true'

    ACCOUNT_NUMBER_PPI: ${env:ACCOUNT_NUMBER_PPI}
    AUTHORIZED_CLIENT_PPI: ${env:AUTHORIZED_CLIENT_PPI}

    CLIENT_KEY_PPI_PROD: ${env:CLIENT_KEY_PPI_PROD}
    API_KEY_PPI_PROD: ${env:API_KEY_PPI_PROD}
    API_SECRET_PPI_PROD: ${env:API_SECRET_PPI_PROD}

    JWT_SECRET: ${env:JWT_SECRET}
    USER_EMAIL: ${env:USER_EMAIL}
    USER_PASSWORD: ${env:USER_PASSWORD}

    ENCRYPTION_KEY: ${env:ENCRYPTION_KEY}
    API_VERSION_PPI: ${env:API_VERSION_PPI}
    API_KEY_PPI_TEST: ${env:API_KEY_PPI_TEST}
    API_SECRET_PPI_TEST: ${env:API_SECRET_PPI_TEST}
    CLIENT_KEY_PPI_TEST: ${env:CLIENT_KEY_PPI_TEST}
    BASE_URL_PPI_TEST: ${env:BASE_URL_PPI_TEST}
    BASE_URL_PPI_PROD: ${env:BASE_URL_PPI_PROD}
    ENCRYPTION_ALGORITHM: ${env:ENCRYPTION_ALGORITHM, 'aes-256-cbc'}
    ENCRYPTION_RANDOM_BYTES: ${env:ENCRYPTION_RANDOM_BYTES, '16'}
    USER_EMAIL_TEST: ${env:USER_EMAIL}
    USER_PASSWORD_TEST: ${env:USER_PASSWORD}

    AWS_REPORTS_BUCKET: ${env:AWS_REPORTS_BUCKET}
    AWS_REPORT_REQUESTS_QUEUE_URL: ${env:AWS_REPORT_REQUESTS_QUEUE_URL}
    REPORT_REQUESTS_TABLE: ReportRequests

    # [Faros AI Word Cloud] - Word Cloud service environment variables:
    FAROS_PROCESSED_URLS_TABLE: FarosProcessedUrls
    FAROS_WORD_COUNTS_TABLE: FarosWordCounts
    FAROS_WORDCLOUD_QUEUE_URL: ${env:FAROS_WORDCLOUD_QUEUE_URL}
    FAROS_WORDCLOUD_CACHE_BUCKET: dev-fedeira-personal-services-bucket

# Lambda functions:
functions:
  auth-service-authorizer:
    handler: authorization-services/handler.authorizer
  authorization-service:
    handler: authorization-services/handler.login
    events:
      - http:
          path: login
          method: post
          cors: true
  investment-service:
    handler: investment-services/handler.getAvailableBalance
    events:
      - http:
          path: investment/available-balance
          method: get
          cors: true
          authorizer:
            name: auth-service-authorizer
            type: TOKEN
  account-service:
    handler: account-services/handler.getAccounts
    events:
      - http:
          path: accounts
          method: get
          cors: true
          authorizer:
            name: auth-service-authorizer
            type: TOKEN
  report-service:
    handler: report-services/lambda.handler
    events:
      - http:
          path: reports/{email}
          method: post
          cors: true
          request:
            parameters:
              paths:
                email: true
          authorizer:
            name: auth-service-authorizer
            type: TOKEN
  # [Faros AI Word Cloud] - Word Cloud HTTP Lambda (GET + POST /wordcloud):
  faros-ai-service:
    handler: faros-ai-services/lambda.handler
    events:
      - http:
          path: wordcloud
          method: get
          cors: true
          authorizer:
            name: auth-service-authorizer
      - http:
          path: wordcloud
          method: post
          cors: true
          authorizer:
            name: auth-service-authorizer

  # [Faros AI Word Cloud] - Word Cloud SQS Processor Lambda:
  faros-ai-processor:
    handler: faros-ai-services/processor-handler.handler
    name: 'dev-fedeira-faros-ai-processor'
    memorySize: 1024
    timeout: 300
    environment:
      FAROS_PROCESSED_URLS_TABLE: FarosProcessedUrls
      FAROS_WORD_COUNTS_TABLE: FarosWordCounts
      FAROS_WORDCLOUD_CACHE_BUCKET: dev-fedeira-personal-services-bucket
    events:
      - sqs:
          arn: arn:aws:sqs:us-east-2:000000000000:FarosWordCloudQueue
          batchSize: 1
          maximumBatchingWindow: 0
          functionResponseType: ReportBatchItemFailures

  report-request-processor:
    handler: report-services/handler.handler
    name: 'dev-fedeira-report-request-processor'
    memorySize: 1024
    timeout: 300
    environment:
      AWS_REPORTS_BUCKET: ${env:AWS_REPORTS_BUCKET}
      REPORT_REQUESTS_TABLE: ReportRequests
    events:
      - sqs:
          arn: arn:aws:sqs:us-east-2:000000000000:ReportRequestsQueue.fifo
          batchSize: 1
          maximumBatchingWindow: 0
          functionResponseType: ReportBatchItemFailures

# DynamoDB resources:
resources:
  Resources:
    UserCredentialsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: UserCredentials
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    AccountsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Accounts
        AttributeDefinitions:
          - AttributeName: account
            AttributeType: S
          - AttributeName: user
            AttributeType: S
        KeySchema:
          - AttributeName: account
            KeyType: HASH
          - AttributeName: user
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

    ReportRequestsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ReportRequests
        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: email
            AttributeType: S
          - AttributeName: status
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S

        KeySchema:
          - AttributeName: id
            KeyType: HASH

        GlobalSecondaryIndexes:
          - IndexName: ByEmail
            KeySchema:
              - AttributeName: email
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: ByStatus
            KeySchema:
              - AttributeName: status
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # [Faros AI Word Cloud] - DynamoDB table for URL deduplication:
    FarosProcessedUrlsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: FarosProcessedUrls
        AttributeDefinitions:
          - AttributeName: url
            AttributeType: S
        KeySchema:
          - AttributeName: url
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    # [Faros AI Word Cloud] - DynamoDB table for word frequency counts:
    FarosWordCountsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: FarosWordCounts
        AttributeDefinitions:
          - AttributeName: word
            AttributeType: S
        KeySchema:
          - AttributeName: word
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    # [Faros AI Word Cloud] - SQS Standard Queue for async URL processing:
    FarosWordCloudQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: FarosWordCloudQueue
        VisibilityTimeout: 300

    ReportRequestsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ReportRequestsQueue.fifo
        FifoQueue: true
        ContentBasedDeduplication: true
        VisibilityTimeout: 300

# Custom settings:
custom:
  dynamodb:
    stages: [dev]
    start:
      port: 8000
      inMemory: true
      migrate: false
      seed: false
      convertEmptyValues: true

  serverless-offline-sqs:
    autoCreate: true
    apiVersion: '2012-11-05'
    endpoint: http://localhost:9324
    region: us-east-2
    accessKeyId: root
    secretAccessKey: root
